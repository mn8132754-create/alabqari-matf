<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العبقري الرياضي - Alabqari Math</title>
    <!-- مكتبة عرض الرياضيات KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #e2e8f0;
            --result-bg: #f1f5f9;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --border-color: #334155;
            --result-bg: #090d16;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 { font-size: 1.5rem; margin: 0; color: var(--primary-color); }
        button.theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button.submit-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.submit-btn:hover { background: var(--primary-hover); }
        .result-box {
            margin-top: 20px;
            background: var(--result-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }
        .steps-list { margin-top: 10px; padding-right: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>العبقري الرياضي 🧠</h1>
            <button class="theme-btn" onclick="toggleTheme()">🌙 / ☀️</button>
        </div>

        <div class="form-group">
            <label>اختر القسم الرياضي:</label>
            <select id="category" onchange="updateFields()">
                <option value="algebra">الجبر والمعادلات</option>
                <option value="calculus">التفاضل والتكامل والنهايات</option>
                <option value="matrices">المصفوفات</option>
            </select>
        </div>

        <div class="form-group">
            <label>اختر العملية:</label>
            <select id="operation">
                <option value="solve">حل المعادلة / تبسيط</option>
                <option value="expand">نشر الأقواس (Expand)</option>
                <option value="factor">تحليل العوامل (Factor)</option>
            </select>
        </div>

        <div class="form-group" id="expr-group">
            <label>أدخل المعادلة أو التعبير الرياضي:</label>
            <input type="text" id="expression" placeholder="مثال: x**2 - 5*x + 6 = 0">
        </div>

        <div class="form-group" id="matrix-group" style="display: none;">
            <label>بيانات المصفوفة (مفصولة بفاصلة كصفوف):</label>
            <textarea id="matrixData" rows="3" placeholder="[[1, 2], [3, 4]]"></textarea>
        </div>

        <button class="submit-btn" onclick="solveProblem()">احسب النتيجة</button>

        <div class="result-box" id="resultBox">
            <h3>النتيجة:</h3>
            <div id="resultOutput" style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;"></div>
            <h3>خطوات الحل:</h3>
            <ul class="steps-list" id="stepsOutput"></ul>
            <div id="errorOutput" style="color: red; margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute("data-theme");
            html.setAttribute("data-theme", currentTheme === "dark" ? "light" : "dark");
        }

        function updateFields() {
            const cat = document.getElementById("category").value;
            const op = document.getElementById("operation");
            const exprGroup = document.getElementById("expr-group");
            const matrixGroup = document.getElementById("matrix-group");

            op.innerHTML = "";
            if (cat === "algebra") {
                exprGroup.style.display = "block";
                matrixGroup.style.display = "none";
                op.innerHTML = `
                    <option value="solve">حل المعادلة / تبسيط</option>
                    <option value="expand">نشر الأقواس</option>
                    <option value="factor">تحليل العوامل</option>
                `;
            } else if (cat === "calculus") {
                exprGroup.style.display = "block";
                matrixGroup.style.display = "none";
                op.innerHTML = `
                    <option value="derivative">المشتقة (Derivative)</option>
                    <option value="integral">التكامل (Integral)</option>
                    <option value="limit">النهاية (Limit)</option>
                `;
            } else if (cat === "matrices") {
                exprGroup.style.display = "none";
                matrixGroup.style.display = "block";
                op.innerHTML = `
                    <option value="determinant">المحدد (Determinant)</option>
                    <option value="inverse">المعكوس (Inverse)</option>
                    <option value="transpose">المنقول (Transpose)</option>
                    <option value="eigenvalues">القيم الذاتية (Eigenvalues)</option>
                `;
            }
        }

        async function solveProblem() {
            const category = document.getElementById("category").value;
            const operation = document.getElementById("operation").value;
            const expression = document.getElementById("expression").value;
            const matrixText = document.getElementById("matrixData").value;

            let matrix_data = null;
            if (category === "matrices") {
                try {
                    matrix_data = JSON.parse(matrixText);
                } catch(e) {
                    alert("صيغة المصفوفة غير صحيحة. استخدم الشكل: [[1,2],[3,4]]");
                    return;
                }
            }

            const payload = { category, operation, expression, matrix_data };
            const resultBox = document.getElementById("resultBox");
            const resultOutput = document.getElementById("resultOutput");
            const stepsOutput = document.getElementById("stepsOutput");
            const errorOutput = document.getElementById("errorOutput");

            resultBox.style.display = "block";
            resultOutput.innerHTML = "جاري الحساب...";
            stepsOutput.innerHTML = "";
            errorOutput.innerHTML = "";

            try {
                // رابط الخادم (محلياً أو بعد النشر على السيرفر)
                const response = await fetch('/api/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (data.success) {
                    resultOutput.innerHTML = data.result;
                    data.steps.forEach(step => {
                        const li = document.createElement("li");
                        li.textContent = step;
                        stepsOutput.appendChild(li);
                    });
                } else {
                    errorOutput.textContent = "خطأ: " + data.error;
                    resultOutput.innerHTML = "";
                }
            } catch (err) {
                errorOutput.textContent = "تعذر الاتصال بالخادم: " + err.message;
                resultOutput.innerHTML = "";
            }
        }
    </script>
</body>
</html>
